services:

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    working_dir: /app

    volumes:
      - ./ta-be:/app
      - /app/vendor

    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile

    working_dir: /app

    volumes:
      - ./ta-fe:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      - backend